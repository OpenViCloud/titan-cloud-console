name: CI — Portal

on:
  # Every push to main publishes titan-cloud-console. Which tag an environment runs is decided outside this repository:
  # dev by scripts/pull-images.py of OpenViCloud/titan-local-cluster, staging by a release of OpenViCloud/titan.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'portal/**'
      - '.github/workflows/ci-portal.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A-1, deferred three times before US-PORTAL-01: portal had 48 lint errors and no gate to
      # stop the 49th. `eslint .` reads eslint-suppressions.json, so this fails in BOTH directions —
      # a new violation is an error, and a suppression whose problem no longer occurs is also an
      # error ("suppressions left that do not occur anymore", exit 2). Neither needs a custom
      # allowlist mechanism: ESLint 9 ships one. Reasons and the shrink plan: portal/eslint-suppressions.md
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      - name: Typecheck & build
        run: npm run build

  # Only a push to main publishes: pull requests (forks included) run the tests with a read-only token.
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published with this repository's token, the package is linked to this repository; the label records the source too.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: portal
          platforms: linux/arm64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/openvicloud/titan-cloud-console:${{ env.SHORT_SHA }}
